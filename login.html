```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Elite Hoops</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="shortcut icon"
        href="img/ELITE HOOPS.png"
        type="image/x-icon"
    >

</head>

<body class="dark">

    <!-- ===================================== -->
    <!-- ⏳ LOADER -->
    <!-- ===================================== -->
    <div id="loader">
        <h1>ELITE HOOPS</h1>
    </div>

    <div class="cursor"></div>

    <!-- ===================================== -->
    <!-- 🧭 NAVBAR -->
    <!-- ===================================== -->
    <nav>

        <h1>ELITE HOOPS</h1>

        <div class="nav-links">

            <a href="cadastro.html">
                Cadastrar
            </a>

        </div>

    </nav>

    <!-- ===================================== -->
    <!-- 🔐 LOGIN -->
    <!-- ===================================== -->
    <div class="auth-container">

        <div class="auth-box">

            <!-- 🔥 LADO ESQUERDO -->
            <div class="auth-left">

                <div class="left-content">

                    <img
                        src="img/elitehooops.png"
                        alt="Logo Elite Hoops"
                    >

                    <h2>
                        Elite Hoops
                    </h2>

                    <p>
                        Entre para o jogo.
                        Seu estilo começa aqui.
                    </p>

                </div>

            </div>



            <!-- 📋 LADO DIREITO -->
            <div class="auth-right">

                <h2>
                    Login
                </h2>

                <!-- EMAIL -->
                <div class="input-group">

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        autocomplete="email"
                    >

                </div>

                <!-- SENHA -->
                <div class="input-group">

                    <input
                        type="password"
                        id="senha"
                        placeholder="Senha"
                        autocomplete="current-password"
                    >

                    <span
                        class="toggle-senha"
                        onclick="toggleSenha()"
                    >
                        
                    </span>

                </div>

                <!-- BOTÃO -->
                <button
                    class="btn-auth"
                    onclick="login()"
                >
                    Entrar
                </button>

                <!-- CADASTRO -->
                <p class="auth-link">

                    Não tem conta?

                    <a href="cadastro.html">
                        Criar uma conta
                    </a>

                </p>

            </div>

        </div>

    </div>

    <!-- ===================================== -->
    <!-- 🔔 TOAST -->
    <!-- ===================================== -->
    <div id="toast"></div>

    <!-- ===================================== -->
    <!-- 🔄 TRANSIÇÃO -->
    <!-- ===================================== -->
    <div id="pageTransition"></div>

    <!-- ===================================== -->
    <!-- 📜 SCRIPT -->
    <!-- ===================================== -->
    <script src="script.js"></script>

</body>

</html>
```
