<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loja - Elite Hoops</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="shortcut icon"
        href="img/ELITE HOOPS.png"
        type="image/x-icon"
    >

</head>

<body class="dark">

    

    <!-- ===================================== -->
    <!-- ⏳ LOADER -->
    <!-- ===================================== -->
    <div id="loader">
        <h1>ELITE HOOPS</h1>
    </div>

    <div class="cursor"></div>

    <!-- ===================================== -->
    <!-- 🧭 NAVBAR -->
    <!-- ===================================== -->
    <nav>

        <h1>
            ELITE HOOPS
        </h1>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="carrinho.html">
                Carrinho
            </a>


        </div>

        <div id="userArea"></div>

    </nav>

    <!-- ===================================== -->
    <!-- 🔎 FILTROS -->
    <!-- ===================================== -->
    <section class="filtros">

        <!-- BUSCA -->
        <input
            type="text"
            id="busca"
            placeholder="Buscar produto..."
        >

        <!-- CATEGORIA -->
        <select id="categoria">

            <option value="">
                Todas categorias
            </option>

            <option value="Basquete">
                Tênis de Basquete
            </option>

            <option value="Futebol">
                Camisa de Futebol
            </option>

            <option value="Moletom">
                Moletom
            </option>

            <option value="Calças">
                Calça
            </option>

            <option value="Shorts">
                Short
            </option>

            <option value="Meias">
                Meia
            </option>

        </select>

        <!-- ORDENAR -->
        <select id="ordenar">

            <option value="">
                Ordenar
            </option>

            <option value="menor">
                Menor preço
            </option>

            <option value="maior">
                Maior preço
            </option>

        </select>

    </section>

    <!-- ===================================== -->
    <!-- 🛍️ CATÁLOGO -->
    <!-- ===================================== -->
    <section
        class="catalogo"
        id="catalogo"
    >
    </section>

    <!-- ===================================== -->
    <!-- 🔔 TOAST -->
    <!-- ===================================== -->
    <div id="toast"></div>

    <!-- ===================================== -->
    <!-- 🔄 TRANSIÇÃO -->
    <!-- ===================================== -->
    <div id="pageTransition"></div>

    <!-- ===================================== -->
    <!-- 🦶 FOOTER -->
    <!-- ===================================== -->
    <footer class="footer">

        <p>
            &copy; 2026 Elite Hoops.
            Todos os direitos reservados.
        </p>

    </footer>

    <!-- ===================================== -->
    <!-- 🌗 SCRIPT TEMA -->
    <!-- ===================================== -->
    <script>

        // CARREGAR TEMA SALVO
        const temaSalvo =
            localStorage.getItem("tema");

        if (temaSalvo === "light") {

            document.body.classList.remove("dark");
            document.body.classList.add("light");

            document
                .getElementById("theme-toggle")
                .innerHTML = "☀️";

        }

        // ALTERAR TEMA
        function alternarTema() {

            document.body.classList.toggle("light");
            document.body.classList.toggle("dark");

            const botao =
                document.getElementById("theme-toggle");

            if (
                document.body.classList.contains("light")
            ) {

                localStorage.setItem(
                    "tema",
                    "light"
                );

                botao.innerHTML = "☀️";

            }
            else {

                localStorage.setItem(
                    "tema",
                    "dark"
                );

                botao.innerHTML = "🌙";
            }
        }

    </script>

    <!-- ===================================== -->
    <!-- 📜 SCRIPT PRINCIPAL -->
    <!-- ===================================== -->
    <script src="script.js"></script>

</body>

</html>
