<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - Elite Hoops</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="shortcut icon"
        href="img/ELITE HOOPS.png"
        type="image/png"
    >
</head>

<body class="dark">

    <!-- ===================================== -->
    <!-- ⏳ LOADER -->
    <!-- ===================================== -->
    <div id="loader">
        <h1>ELITE HOOPS</h1>
    </div>

    <!-- ===================================== -->
    <!-- 🧭 NAVBAR -->
    <!-- ===================================== -->
    <nav>

        <h1>ELITE HOOPS</h1>

        <div class="nav-links">

            <a href="login.html">
                Entrar
            </a>

        </div>

    </nav>

    <!-- ===================================== -->
    <!-- 📦 CONTAINER -->
    <!-- ===================================== -->
    <div class="auth-container">

        <div class="auth-box">

            <!-- ============================== -->
            <!-- 🔥 LADO ESQUERDO -->
            <!-- ============================== -->
            <div class="auth-left">

                <div class="left-content">

                    <img
                        src="img/elitehooops.png"
                        alt="Elite Hoops Logo"
                    >

                    <h2>
                        Junte-se à Elite 🏀
                    </h2>

                    <p>
                        Crie sua conta e entre no jogo.
                    </p>

                </div>

            </div>

            <!-- ============================== -->
            <!-- 📋 LADO DIREITO -->
            <!-- ============================== -->
            <div class="auth-right">

                <h2>Cadastro</h2>

                <!-- NOME -->
                <div class="input-group">

                    <input
                        type="text"
                        id="nome"
                        placeholder="Nome completo"
                        autocomplete="name"
                    >

                </div>

                <!-- EMAIL -->
                <div class="input-group">

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        autocomplete="email"
                    >

                </div>



                <!-- SENHA -->
                <div class="input-group">

                    <input
                        type="password"
                        id="senha"
                        placeholder="Senha"
                        autocomplete="new-password"
                    >

                    <span
                        class="toggle-senha"
                        onclick="toggleSenha()"
                    >
                        
                    </span>

                </div>

                <!-- BOTÃO -->
                <button
                    class="btn-auth"
                    onclick="cadastro()"
                >
                    Criar Conta
                </button>

                <!-- LOGIN -->
                <p class="auth-link">

                    Já tem conta?

                    <a href="login.html">
                        Entrar
                    </a>

                </p>

            </div>

        </div>

    </div>

    <!-- ===================================== -->
    <!-- 🔔 TOAST -->
    <!-- ===================================== -->
    <div id="toast"></div>

    <!-- ===================================== -->
    <!-- 📜 SCRIPT -->
    <!-- ===================================== -->
    <script src="script.js"></script>

</body>

</html>
